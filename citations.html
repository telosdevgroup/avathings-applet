<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ava Citations Ledger</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #090d13;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      padding: 0;
      margin: 0;
      overflow-y: auto;
    }
    header {
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 0;
    }
    .main-content {
      padding: 20px 24px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title {
      font-weight: bold;
      color: #58a6ff;
      letter-spacing: 0.5px;
      margin-right: 4px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background-color: #0d1117;
      padding: 2px 4px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    .filter-btn {
      background: none;
      border: 1px solid transparent;
      color: #8b949e;
      padding: 2px 8px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .filter-btn:hover {
      color: #c9d1d9;
      background-color: #21262d;
    }
    .filter-btn.active {
      color: #fff;
      font-weight: bold;
    }
    .filter-btn.all.active {
      background-color: #1f6feb;
      border-color: #388bfd;
    }
    .filter-btn.site-scry.active {
      background-color: rgba(88, 166, 255, 0.2);
      border-color: #58a6ff;
      color: #58a6ff;
    }
    .filter-btn.site-vet.active {
      background-color: rgba(63, 185, 80, 0.2);
      border-color: #3fb950;
      color: #3fb950;
    }
    .filter-btn.site-minder.active {
      background-color: rgba(210, 168, 255, 0.2);
      border-color: #d2a8ff;
      color: #d2a8ff;
    }
    .filter-btn.site-specs.active {
      background-color: rgba(240, 136, 62, 0.2);
      border-color: #f0883e;
      color: #f0883e;
    }
    .filter-btn.site-vetha.active {
      background-color: rgba(46, 160, 67, 0.2);
      border-color: #2ea043;
      color: #2ea043;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    button.action-btn, a.action-link {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    button.action-btn:hover, a.action-link:hover {
      background-color: #30363d;
      color: #fff;
    }

    /* KPI TILES */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .tile {
      background-color: #11151c;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 14px 16px;
    }
    .tile-title {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #8b949e;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .tile-value {
      font-size: 24px;
      font-weight: 700;
      color: #e6edf3;
      font-family: Consolas, monospace;
    }
    .tile-sub {
      font-size: 11px;
      color: #8b949e;
      margin-top: 4px;
    }

    /* SPLIT VIEW */
    .layout-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }
    .panel {
      background-color: #11151c;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel-header {
      font-size: 12px;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: 0.5px;
      border-bottom: 1px dashed #30363d;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    /* LEADERBOARD LIST */
    .leader-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 600px;
      overflow-y: auto;
    }
    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: Consolas, monospace;
      border-bottom: 1px solid #161b22;
    }
    .leader-row:hover {
      background-color: #161b22;
    }
    .leader-route {
      color: #7ee787;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }
    .leader-badge {
      color: #e6edf3;
      font-weight: bold;
    }

    /* CHRONOLOGICAL CITATIONS TABLE */
    .table-container {
      max-height: 600px;
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: Consolas, monospace;
      font-size: 12px;
    }
    th {
      position: sticky;
      top: 0;
      background-color: #161b22;
      color: #8b949e;
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid #30363d;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    td {
      padding: 6px 10px;
      border-bottom: 1px solid #161b22;
      white-space: nowrap;
    }
    tr:hover {
      background-color: #161b22;
    }
    .badge-chatgpt {
      background: rgba(16, 163, 127, 0.15);
      color: #10a37f;
      border: 1px solid rgba(16, 163, 127, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }
    .badge-claude {
      background: rgba(217, 119, 6, 0.15);
      color: #d97706;
      border: 1px solid rgba(217, 119, 6, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }
    .badge-perplexity {
      background: rgba(88, 166, 255, 0.15);
      color: #58a6ff;
      border: 1px solid rgba(88, 166, 255, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }
    .site-tag {
      font-weight: bold;
      color: #58a6ff;
    }
    .cite-link {
      color: #7ee787;
      text-decoration: none;
    }
    .cite-link:hover {
      text-decoration: underline;
    }
    .time-tag {
      color: #8b949e;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <span class="title">⚡ AVA TRAFFIC</span>
      <span class="badge" style="background-color: #238636; color: #fff; margin-right: 6px;">CITATIONS</span>
      <div class="filter-group">
        <button class="filter-btn all active" onclick="switchSite('ALL', this)">ALL SITES</button>
        <button class="filter-btn site-scry" onclick="switchSite('AvaScry', this)">AvaScry</button>
        <button class="filter-btn site-specs" onclick="switchSite('AvaSpecs', this)">AvaSpecs</button>
        <button class="filter-btn site-vet" onclick="switchSite('VetGems', this)">VetGems</button>
        <button class="filter-btn site-minder" onclick="switchSite('AvaMinder', this)">AvaMinder</button>
        <button class="filter-btn site-vetha" onclick="switchSite('VethaGolf', this)">VethaGolf</button>
      </div>
    </div>
    <div class="controls">
      <a href="/" target="_self" class="action-link">⚡ Stream</a>
      <a href="/stats" target="_self" class="action-link">📊 Stats</a>
      <a href="/citations" target="_self" class="action-link" style="background-color: #1f6feb; border-color: #388bfd; color: #fff; font-weight: bold;">🎯 Citations</a>
      <span style="color: #30363d; margin: 0 4px;">|</span>
      <button class="action-btn" onclick="loadCitations()">↻ Refresh</button>
    </div>
  </header>

  <div class="main-content">
  <!-- DYNAMIC KPI SUMMARY TILES -->
  <div id="summary-grid" class="summary-grid">
    <!-- Populated dynamically based on actual AI citation sources present -->
  </div>

  <!-- MAIN SPLIT -->
  <div class="layout-grid">
    <!-- LEADERBOARD -->
    <div class="panel">
      <div class="panel-header">
        <span>TOP CITED CONTENT</span>
        <span>CITATIONS</span>
      </div>
      <div id="leaderboard-list" class="leader-list">Loading...</div>
    </div>

    <!-- REVERSE CHRONOLOGICAL CITATION FEED -->
    <div class="panel">
      <div class="panel-header">
        <span>CHRONOLOGICAL CITATION LOG (NEWEST FIRST)</span>
        <span id="log-count">0 items</span>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>TIME (UTC)</th>
              <th>PLATFORM</th>
              <th>SITE</th>
              <th>CONTENT / URL CITED</th>
              <th>FORMAT</th>
            </tr>
          </thead>
          <tbody id="citations-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let rawData = null;
    const urlParams = new URLSearchParams(window.location.search);
    let currentSite = urlParams.get("site") || "ALL";

    async function loadCitations() {
      try {
        const resp = await fetch("/api/citations");
        const data = await resp.json();
        if (!data.loading) {
          rawData = data;
          applySiteUI(currentSite);
          render();
        } else {
          setTimeout(loadCitations, 1000);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function applySiteUI(site) {
      document.querySelectorAll(".filter-btn").forEach(b => {
        const onclickAttr = b.getAttribute("onclick") || "";
        if (onclickAttr.includes(`'${site}'`)) {
          b.classList.add("active");
        } else {
          b.classList.remove("active");
        }
      });
    }

    function switchSite(site, btn) {
      currentSite = site;
      const url = new URL(window.location);
      if (site === "ALL") {
        url.searchParams.delete("site");
      } else {
        url.searchParams.set("site", site);
      }
      window.history.replaceState({}, "", url);

      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      render();
    }

    function getSiteDomain(site) {
      if (site.toLowerCase().includes("scry")) return "https://avascry.com";
      if (site.toLowerCase().includes("specs")) return "https://avaspecs.com";
      if (site.toLowerCase().includes("vet")) return "https://vetgems.com";
      if (site.toLowerCase().includes("minder")) return "https://avaminder.com";
      return "";
    }

    // Color & style palette for platforms (auto-falls back to clean cyan for new unknown platforms)
    const PLATFORM_THEMES = {
      chatgpt: { name: "ChatGPT", color: "#10a37f", bg: "rgba(16, 163, 127, 0.15)", border: "rgba(16, 163, 127, 0.3)" },
      claude: { name: "Claude", color: "#d97706", bg: "rgba(217, 119, 6, 0.15)", border: "rgba(217, 119, 6, 0.3)" },
      perplexity: { name: "Perplexity", color: "#58a6ff", bg: "rgba(88, 166, 255, 0.15)", border: "rgba(88, 166, 255, 0.3)" },
      meta: { name: "Meta AI", color: "#db61a2", bg: "rgba(219, 97, 162, 0.15)", border: "rgba(219, 97, 162, 0.3)" },
      gemini: { name: "Gemini", color: "#388bfd", bg: "rgba(56, 139, 253, 0.15)", border: "rgba(56, 139, 253, 0.3)" },
      apple: { name: "Apple", color: "#f778ba", bg: "rgba(247, 120, 186, 0.15)", border: "rgba(247, 120, 186, 0.3)" },
      default: { name: "AI Agent", color: "#79c0ff", bg: "rgba(121, 192, 255, 0.15)", border: "rgba(121, 192, 255, 0.3)" }
    };

    function getPlatformMeta(sourceStr) {
      const lower = (sourceStr || "").toLowerCase();
      for (const [key, meta] of Object.entries(PLATFORM_THEMES)) {
        if (key !== "default" && lower.includes(key)) {
          return meta;
        }
      }
      return PLATFORM_THEMES.default;
    }

    function render() {
      if (!rawData) return;

      const filteredItems = currentSite === "ALL" 
        ? rawData.items 
        : rawData.items.filter(i => i.site === currentSite);

      // Group counts dynamically by platform
      const platformCounts = {};
      const uniqueRoutes = new Set();

      filteredItems.forEach(i => {
        const meta = getPlatformMeta(i.source);
        platformCounts[meta.name] = (platformCounts[meta.name] || 0) + 1;
        uniqueRoutes.add(i.route);
      });

      // Build Dynamic KPI Tiles:
      // Tile 1: Total Content Citations
      // Tile 2..N: Dynamic tiles for each platform that actually has hits (ChatGPT, Claude, Perplexity, etc.)
      // Last Tile: Unique Pages Cited
      const grid = document.getElementById("summary-grid");
      let tilesHtml = `
        <div class="tile">
          <div class="tile-title" style="color: #58a6ff;">Total Content Citations</div>
          <div class="tile-value" style="color: #58a6ff;">${filteredItems.length.toLocaleString()}</div>
          <div class="tile-sub">Observed user-agent content hits</div>
        </div>
      `;

      // Sort platforms by count descending
      const sortedPlatforms = Object.entries(platformCounts).sort((a, b) => b[1] - a[1]);
      sortedPlatforms.forEach(([platName, count]) => {
        const meta = getPlatformMeta(platName);
        tilesHtml += `
          <div class="tile">
            <div class="tile-title" style="color: ${meta.color};">${meta.name} Prompts</div>
            <div class="tile-value" style="color: ${meta.color};">${count.toLocaleString()}</div>
            <div class="tile-sub">Live citations from ${meta.name}</div>
          </div>
        `;
      });

      tilesHtml += `
        <div class="tile">
          <div class="tile-title">Unique Pages Cited</div>
          <div class="tile-value" style="color: #e6edf3;">${uniqueRoutes.size.toLocaleString()}</div>
          <div class="tile-sub">Distinct content paths</div>
        </div>
      `;

      grid.innerHTML = tilesHtml;
      document.getElementById("log-count").textContent = `${filteredItems.length} citations`;

      // Leaderboard
      const routeCounts = {};
      filteredItems.forEach(i => {
        routeCounts[i.route] = (routeCounts[i.route] || 0) + 1;
      });

      const sortedLeaderboard = Object.entries(routeCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 40);

      document.getElementById("leaderboard-list").innerHTML = sortedLeaderboard.map(([route, count]) => `
        <div class="leader-row">
          <span class="leader-route" title="${route}">${route}</span>
          <span class="leader-badge">${count}</span>
        </div>
      `).join("");

      // Chronological Table
      const tbody = document.getElementById("citations-tbody");
      tbody.innerHTML = filteredItems.map(i => {
        const meta = getPlatformMeta(i.source);
        const domain = getSiteDomain(i.site);
        const fullUrl = domain + i.route;
        const displayTime = i.timestamp ? i.timestamp.replace("T", " ").slice(5, 19) : "-";

        return `
          <tr title="${i.raw}">
            <td class="time-tag">${displayTime}</td>
            <td>
              <span style="background:${meta.bg}; color:${meta.color}; border:1px solid ${meta.border}; padding:2px 6px; border-radius:4px; font-weight:600; font-size:11px;">
                ${meta.name}
              </span>
            </td>
            <td class="site-tag">[${i.site}]</td>
            <td><a href="${fullUrl}" target="_blank" class="cite-link">${i.route}</a></td>
            <td style="color:#bc8cff;">${i.format}</td>
          </tr>
        `;
      }).join("");
    }

    loadCitations();
  </script>
  </div>
</body>
</html>
