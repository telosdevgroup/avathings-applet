<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEL0S Command Inventory</title>
  <style>
    :root {
      --bg: #0f141c;
      --card-bg: #171f2c;
      --border: #2b3648;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --btn-bg: #1e293b;
      --btn-border: #334155;
      --btn-hover: #0284c7;
      --code-bg: #0b0f17;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .panel-header {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: var(--code-bg);
      color: #7dd3fc;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      resize: vertical;
    }
    .actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    button {
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--btn-border);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover {
      background: var(--btn-hover);
      border-color: var(--btn-hover);
      color: #fff;
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      background: #131b26;
      color: var(--text-dim);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .app-name {
      font-weight: bold;
      color: #fff;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 0.75rem;
      border-radius: 4px;
      background: #334155;
      color: #cbd5e1;
      margin-top: 4px;
    }
    .cmd-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cmd-badge {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.82rem;
    }
    .copy-btn {
      padding: 2px 6px;
      font-size: 0.75rem;
      background: transparent;
      border: 1px solid var(--btn-border);
      border-radius: 3px;
      color: var(--text-dim);
    }
    .copy-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }
    .copied {
      color: #4ade80 !important;
      border-color: #4ade80 !important;
    }
    .folder-path {
      color: #a5b4fc;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.8rem;
      word-break: break-all;
    }
    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TEL0S Command Inventory</h1>

    <div class="panel">
      <div class="panel-header">
        <span>Structured JSON Source</span>
        <span id="status-indicator"></span>
      </div>
      <textarea id="json-input"></textarea>
      <div class="actions">
        <button id="parse-btn" onclick="renderTable()">Update Table</button>
        <button onclick="resetDefault()">Reset to Initial</button>
      </div>
      <div id="json-error" class="error-msg"></div>
    </div>

    <div class="panel table-container">
      <table id="commands-table">
        <thead>
          <tr>
            <th style="width: 15%">App / Kind</th>
            <th style="width: 20%">Folder</th>
            <th style="width: 20%">Start Command</th>
            <th style="width: 20%">Watcher Command</th>
            <th style="width: 25%">Utilities</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const defaultData = [
      {
        "name": "VetGems",
        "kind": "app",
        "folder": "C:\\Users\\dev\\Code\\tdg\\vetgems",
        "start": "python main.py",
        "watcher": "python domain_watch.py",
        "utilities": [
          "python scripts/build_sitemap.py",
          "python scripts/rebuild_blurbs.py"
        ],
        "about": "Veterinary-practice search site and data lake."
      }
    ];

    const jsonInput = document.getElementById('json-input');
    const tableBody = document.getElementById('table-body');
    const jsonError = document.getElementById('json-error');

    function init() {
      jsonInput.value = JSON.stringify(defaultData, null, 2);
      renderTable();
    }

    function resetDefault() {
      jsonInput.value = JSON.stringify(defaultData, null, 2);
      renderTable();
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.innerText;
        btn.innerText = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerText = orig;
          btn.classList.remove('copied');
        }, 1200);
      });
    }

    function renderCommandBadge(cmd) {
      if (!cmd) return '<span style="color: var(--text-dim); font-size: 0.8rem;">none</span>';
      const escaped = encodeURIComponent(cmd);
      return `
        <div class="cmd-badge">
          <code>${cmd}</code>
          <button class="copy-btn" onclick="copyToClipboard(decodeURIComponent('${escaped}'), this)">Copy</button>
        </div>
      `;
    }

    function renderTable() {
      jsonError.innerText = '';
      let items;
      try {
        items = JSON.parse(jsonInput.value);
        if (!Array.isArray(items)) {
          throw new Error('Root JSON must be an array of entries.');
        }
      } catch (err) {
        jsonError.innerText = 'JSON Parse Error: ' + err.message;
        return;
      }

      tableBody.innerHTML = '';
      items.forEach(item => {
        const tr = document.createElement('tr');

        const utilitiesHtml = Array.isArray(item.utilities) && item.utilities.length > 0
          ? `<div class="cmd-group">${item.utilities.map(u => renderCommandBadge(u)).join('')}</div>`
          : '<span style="color: var(--text-dim); font-size: 0.8rem;">none</span>';

        const folderEscaped = item.folder ? encodeURIComponent(item.folder) : '';
        const folderHtml = item.folder
          ? `<div class="cmd-badge"><span class="folder-path">${item.folder}</span><button class="copy-btn" onclick="copyToClipboard(decodeURIComponent('${folderEscaped}'), this)">Copy</button></div>`
          : '<span style="color: var(--text-dim); font-size: 0.8rem;">none</span>';

        tr.innerHTML = `
          <td>
            <div class="app-name">${item.name || 'Untitled'}</div>
            <span class="badge">${item.kind || 'app'}</span>
            ${item.about ? `<div style="margin-top: 6px; font-size: 0.8rem; color: var(--text-dim);">${item.about}</div>` : ''}
          </td>
          <td>${folderHtml}</td>
          <td>${renderCommandBadge(item.start)}</td>
          <td>${renderCommandBadge(item.watcher)}</td>
          <td>${utilitiesHtml}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
